<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Student Performance System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0a0f, #1a1a2e, #16213e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      font-size: 1.8rem;
      color: #1a73e8;
      font-weight: 800;
    }

    .logo p {
      color: #666;
      font-size: 0.9rem;
      margin-top: 5px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #444;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 13px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s;
    }

    input:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 4px rgba(26,115,232,0.1);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1a73e8, #0d47a1);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(26,115,232,0.4);
    }

    .btn-green {
      background: linear-gradient(135deg, #34a853, #1b5e20);
    }

    .links {
      text-align: center;
      margin-top: 20px;
    }

    .links a {
      color: #1a73e8;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      font-weight: 600;
      display: none;
      text-align: center;
    }

    .error {
      background: #fce8e8;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }

    .success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }

    .code-box {
      background: #fff3e0;
      border: 2px solid #ff9800;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin: 20px 0;
      display: none;
    }

    .code-box p {
      font-size: 0.9rem;
      color: #e65100;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .code-box h2 {
      font-size: 2.5rem;
      color: #e65100;
      font-weight: 900;
      letter-spacing: 8px;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }
  </style>
</head>
<body>

<div class="box">
  <div class="logo">
    <h1>🔑 Reset Password</h1>
    <p>Student Performance Analysis System</p>
  </div>

  <div class="message" id="message"></div>

  <!-- STEP 1: Enter Email -->
  <div class="step active" id="step1">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="reset_email" placeholder="Enter your registered email">
    </div>
    <button class="btn" onclick="sendCode()">📧 Get Reset Code</button>
  </div>

  <!-- STEP 2: Show Code and Enter New Password -->
  <div class="step" id="step2">

    <div class="code-box" id="code_box">
      <p>🔐 Your Reset Code is:</p>
      <h2 id="reset_code_display"></h2>
      <p>Use this code to reset your password</p>
    </div>

    <div class="form-group">
      <label>Enter Reset Code</label>
      <input type="text" id="enter_code" placeholder="Enter the code shown above">
    </div>

    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="new_password" placeholder="Enter new password">
    </div>

    <div class="form-group">
      <label>Confirm New Password</label>
      <input type="password" id="confirm_new_password" placeholder="Confirm new password">
    </div>

    <button class="btn btn-green" onclick="resetPassword()">✅ Reset Password</button>
  </div>

  <div class="links">
    <a href="/login">🔐 Back to Login</a>
  </div>
</div>

<script>
async function sendCode() {
  const email = document.getElementById('reset_email').value;

  if (!email) {
    showMessage('Please enter your email!', 'error');
    return;
  }

  const response = await fetch('/forgot', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'send_code', email })
  });

  const data = await response.json();

  if (data.success) {
    // Show reset code on screen
    document.getElementById('reset_code_display').textContent = data.code;
    document.getElementById('code_box').style.display = 'block';

    // Show step 2
    document.getElementById('step1').classList.remove('active');
    document.getElementById('step2').classList.add('active');

    showMessage('Reset code generated! Use it below.', 'success');
  } else {
    showMessage(data.message, 'error');
  }
}

async function resetPassword() {
  const code = document.getElementById('enter_code').value;
  const password = document.getElementById('new_password').value;
  const confirm = document.getElementById('confirm_new_password').value;

  if (!code || !password || !confirm) {
    showMessage('Please fill all fields!', 'error');
    return;
  }

  if (password !== confirm) {
    showMessage('Passwords do not match!', 'error');
    return;
  }

  if (password.length < 6) {
    showMessage('Password must be at least 6 characters!', 'error');
    return;
  }

  const response = await fetch('/forgot', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'reset_password', code, password })
  });

  const data = await response.json();

  if (data.success) {
    showMessage('Password reset successfully! Redirecting to login...', 'success');
    setTimeout(() => { window.location.href = '/login'; }, 2000);
  } else {
    showMessage(data.message, 'error');
  }
}

function showMessage(msg, type) {
  const el = document.getElementById('message');
  el.textContent = msg;
  el.className = 'message ' + type;
  el.style.display = 'block';
}
</script>
</body>
</html>
