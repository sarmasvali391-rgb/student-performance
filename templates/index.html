<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Performance Analysis</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header>
    <h1>📊 Student Performance Analysis System</h1>
    <p>Enter student details to get instant results</p>
  </header>

  <div class="container">
    <div class="form-box">
      <h2>Enter Student Details</h2>

      <div class="form-group">
        <label>Student Name</label>
        <textarea id="name" placeholder="Enter full name" rows="2"></textarea>
      </div>

      <div class="form-group">
        <label>Attendance (%)</label>
        <input type="number" id="attendance" placeholder="e.g. 85">
      </div>

      <div class="form-group">
        <label>Daily Study Hours</label>
        <input type="number" id="study_hours" placeholder="e.g. 3">
      </div>

      <div class="form-group">
        <label>Internal Marks (out of 100)</label>
        <input type="number" id="internal" placeholder="e.g. 70">
      </div>

      <div class="form-group">
        <label>External Marks (out of 100)</label>
        <input type="number" id="external" placeholder="e.g. 65">
      </div>

      <div class="form-group">
        <label>Gender</label>
        <select id="gender">
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>

      <h3>📚 Subject Marks (out of 100)</h3>

      <div class="form-group">
        <label>Mathematics</label>
        <input type="number" id="math" placeholder="e.g. 80">
      </div>

      <div class="form-group">
        <label>Science</label>
        <input type="number" id="science" placeholder="e.g. 75">
      </div>

      <div class="form-group">
        <label>English</label>
        <input type="number" id="english" placeholder="e.g. 70">
      </div>

      <div class="form-group">
        <label>Kannada</label>
        <input type="number" id="kannada" placeholder="e.g. 65">
      </div>

      <div class="form-group">
        <label>Social Science</label>
        <input type="number" id="social" placeholder="e.g. 60">
      </div>

      <button onclick="analyzeStudent()">🔍 Analyze Performance</button>
    </div>

    <!-- RESULTS -->
    <div class="results-box" id="results" style="display:none">

      <button onclick="window.print()" id="printBtn">🖨️ Print / Save as PDF</button>s

      <div class="cards">
        <div class="card">
          <p>Total Marks (out of 500)</p>
         <h3 id="res_total"></h3>
        </div>
        <div class="card">
          <p>Percentage</p>
          <h3 id="res_pct"></h3>
        </div>
        <div class="card">
          <p>Grade</p>
          <h3 id="res_grade"></h3>
        </div>
        <div class="card">
          <p>Status</p>
          <h3 id="res_status"></h3>
        </div>
        <div class="card">
          <p>Risk Level</p>
          <h3 id="res_risk"></h3>
        </div>
        <div class="card">
          <p>Weak Subjects</p>
          <h3 id="res_weak"></h3>
        </div>
      </div>

      <div class="charts">
        <div class="chart-box">
          <h3>Subject Marks</h3>
          <canvas id="barChart"></canvas>
        </div>
        <div class="chart-box">
          <h3>Internal vs External</h3>
          <canvas id="pieChart"></canvas>
        </div>
      </div>

    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
